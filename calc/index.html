<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Calculator</title>
    </head>
    <body>
        <div class="wrapper">
            <input type="text" value="0" id="output" readonly="readonly">
            <button title="Степень" name='**'>^</button>
            <button title="Остаток" name='%'>M</button>
            <button title="Удалить" name='B'>B</button>
            <button title="Очистить" name='C'>C</button>
            <button title="Семь" name='7'>7</button>
            <button title="Восемь" name='8'>8</button>
            <button title="Девять" name='9'>9</button>
            <button title="Делить" name='/'>/</button>
            <button title="Четыре" name='4'>4</button>
            <button title="Пять" name='5'>5</button>
            <button title="Шесть" name='6'>6</button>
            <button title="Умножить" name='*'>x</button>
            <button title="Один" name='1'>1</button>
            <button title="Два" name='2'>2</button>
            <button title="Три" name='3'>3</button>
            <button title="Сложить" name='+'>+</button>
            <button title="Разделитель" name='.'>.</button>
            <button title="Ноль" name='0'>0</button>
            <button title="Равно" name='='>=</button>
            <button title="Вычесть" name='-'>-</button>
        </div>

        <script src="app.js"></script>
    </body>
</html>
