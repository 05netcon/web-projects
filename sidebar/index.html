<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <script defer src="https://use.fontawesome.com/releases/v5.3.1/js/all.js"></script>
        <link rel="stylesheet" href="css/style.css">
        <title>Cohn Reznick</title>
    </head>
    <body>
        <aside>
            <div class="logo">
                <img src="images/logo.png" alt="logo">
                <h2>Cohn Reznick</h2>
            </div>
            <div class="aside-list">
                <div class="aside-list-block">
                    <i class="fas fa-user left"></i>
                    Profiles
                    <i class="fas fa-chevron-right right"></i>
                    <div class="aside-list-subblock">
                        <a class="active" href="">Main profile</a>
                        <a href="">Reserved profile</a>
                        <a href="">Secondary profile</a>
                    </div>
                </div>
                <div class="aside-list-block">
                    <i class="fas fa-server left"></i>
                    Transactions
                    <i class="fas fa-chevron-right right"></i>
                    <div class="aside-list-subblock">
                        <a href="">Main profile</a>
                        <a href="">Reserved profile</a>
                        <a href="">Secondary profile</a>
                    </div>
                </div>
                <div class="aside-list-block">
                    <i class="fas fa-cog left"></i>
                    Settings
                    <i class="fas fa-chevron-right right"></i>
                    <div class="aside-list-subblock">
                        <a href="">Main profile</a>
                        <a href="">Reserved profile</a>
                        <a href="">Secondary profile</a>
                    </div>
                </div>
            </div>
        </aside>
        
        <script src="js/app.js"></script>
    </body>
</html>
